name: Prelaunch repository checks
on:
  push:
    branches:
      - main
      - 'prelaunch/**'
  pull_request:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/prelaunch.mjs
